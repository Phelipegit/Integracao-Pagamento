services:
  redis-service:
    image: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - "redis-data:/data"
  rabbitmq-service:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
  postgres-service:
    image: postgres
    environment:
      POSTGRES_USER: phelipedev
      POSTGRES_PASSWORD: phelipedev
      POSTGRES_DB: integracaopagamento
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
volumes:
  rabbitmq-data:
  postgres-data:
  redis-data:


